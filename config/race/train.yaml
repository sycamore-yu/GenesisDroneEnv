seed: 0
updates: 1000
save_interval: 100
log_root: logs/race
eval_states: 4096
eval_seed: 0
num_envs:
  ppo: 1024
  apg: 1024
  shac: 1024

network:
  hidden_sizes: [256, 128]

environment:
  dynamics: native_quad
  dt: 0.0333
  horizon: 32
  max_episode_steps: 1201
  gamma: 0.99
  td_lambda: 0.95

apg:
  horizon: 32
  learning_rate: 0.001
  max_grad_norm: 1.0

shac:
  horizon: 32
  actor_learning_rate: 0.001
  critic_learning_rate: 0.001
  gamma: 0.99
  td_lambda: 0.95
  entropy_weight: 0.0
  actor_max_grad_norm: 1.0
  critic_max_grad_norm: 1.0
  critic_minibatches: 8
  critic_iterations: 1
  target_update_rate: 0.005
  log_standard_deviation_min: -5.0
  log_standard_deviation_max: -1.0

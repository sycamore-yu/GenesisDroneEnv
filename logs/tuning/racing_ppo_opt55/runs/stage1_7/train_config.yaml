seed: 0
max_iterations: 200
num_steps_per_env: 16
save_interval: 50
obs_groups:
  actor:
  - policy
  critic:
  - policy
algorithm:
  class_name: PPO
  clip_param: 0.2
  desired_kl: 0.020933229765463766
  entropy_coef: 0.009229587245058637
  gamma: 0.99
  lam: 0.95
  learning_rate: 0.002718679041378583
  max_grad_norm: 1.0
  num_learning_epochs: 4
  num_mini_batches: 8
  schedule: adaptive
  use_clipped_value_loss: true
  value_loss_coef: 2.0
actor:
  class_name: MLPModel
  hidden_dims: &id001
  - 256
  - 128
  activation: elu
  obs_normalization: false
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.4122116705145822
    std_type: log
critic:
  class_name: MLPModel
  hidden_dims: *id001
  activation: elu
  obs_normalization: false
experiment_name: diffaero-racing-full-quad-ppo
multi_gpu: null

seed: 0
max_iterations: 1000
num_steps_per_env: 16
save_interval: 100
obs_groups:
  policy:
  - policy
  critic:
  - policy
algorithm:
  class_name: PPO
  clip_param: 0.2
  desired_kl: 0.01
  entropy_coef: 0.01
  gamma: 0.99
  lam: 0.95
  learning_rate: 0.001
  max_grad_norm: 1.0
  num_learning_epochs: 4
  num_mini_batches: 8
  schedule: adaptive
  use_clipped_value_loss: true
  value_loss_coef: 2.0
policy:
  class_name: ActorCritic
  activation: elu
  actor_hidden_dims:
  - 256
  - 128
  critic_hidden_dims:
  - 256
  - 128
  init_noise_std: 0.2231301601
  noise_std_type: log
runner_class_name: OnPolicyRunner
experiment_name: diffaero-racing-full-quad-ppo
